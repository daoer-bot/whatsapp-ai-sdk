<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp AI Extension hero</title>
  <desc id="desc">Portfolio hero banner for the unofficial Chromium MV3 WhatsApp Web AI extension.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="980" cy="160" r="220" fill="url(#orb)"/>
  <circle cx="200" cy="520" r="180" fill="url(#orb)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#glow)"/>

  <!-- left copy -->
  <text x="88" y="170" fill="#67e8f9" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="0.18em">CHROMIUM MV3 · UNOFFICIAL</text>
  <text x="88" y="250" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="54" font-weight="800">WhatsApp AI</text>
  <text x="88" y="316" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="54" font-weight="800">Extension</text>
  <text x="88" y="372" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="22">Page-world inject · WPP / React / DOM fallback</text>
  <text x="88" y="408" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="22">Optional AI replies · default mock · minimal permissions</text>

  <rect x="88" y="450" width="168" height="44" rx="22" fill="url(#btn)"/>
  <text x="172" y="478" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">✦ AI assist</text>
  <rect x="272" y="450" width="200" height="44" rx="22" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="372" y="478" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="15">window.WhatsappAI</text>

  <!-- right mini architecture cards -->
  <rect x="760" y="150" width="400" height="340" rx="24" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <rect x="792" y="186" width="336" height="100" rx="16" fill="#1e3a8a"/>
  <text x="816" y="224" fill="#bfdbfe" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">ISOLATED</text>
  <text x="816" y="252" fill="#eff6ff" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">content.js + UI</text>
  <text x="960" y="318" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="14">postMessage RPC</text>
  <rect x="792" y="340" width="336" height="100" rx="16" fill="#115e59"/>
  <text x="816" y="378" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">PAGE WORLD</text>
  <text x="816" y="406" fill="#ecfdf5" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">inject + WPP → DOM</text>

  <text x="88" y="580" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Not affiliated with WhatsApp, Meta, or WPPConnect</text>
</svg>
