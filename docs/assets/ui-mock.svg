<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp AI Extension UI mock</title>
  <desc id="desc">Stylized WhatsApp Web chat with purple AI star button, composer, and explain panel. Demo content only.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111b21"/>
      <stop offset="100%" stop-color="#0b141a"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202c33"/>
      <stop offset="100%" stop-color="#1a242b"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- browser chrome -->
  <rect width="960" height="520" rx="18" fill="#0f172a"/>
  <rect x="16" y="16" width="928" height="40" rx="10" fill="#1e293b"/>
  <circle cx="40" cy="36" r="6" fill="#f87171"/>
  <circle cx="60" cy="36" r="6" fill="#fbbf24"/>
  <circle cx="80" cy="36" r="6" fill="#34d399"/>
  <rect x="120" y="26" width="520" height="20" rx="10" fill="#0f172a"/>
  <text x="140" y="40" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12">web.whatsapp.com — demo</text>

  <!-- app shell -->
  <rect x="16" y="64" width="928" height="440" rx="12" fill="url(#page)"/>

  <!-- side list -->
  <rect x="16" y="64" width="260" height="440" fill="#111b21"/>
  <rect x="16" y="64" width="260" height="56" fill="url(#header)"/>
  <text x="36" y="98" fill="#e9edef" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Chats</text>
  <rect x="28" y="136" width="236" height="64" rx="10" fill="#2a3942"/>
  <circle cx="56" cy="168" r="16" fill="#00a884"/>
  <text x="84" y="164" fill="#e9edef" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">logistics_demo</text>
  <text x="84" y="184" fill="#8696a0" font-family="Segoe UI, system-ui, sans-serif" font-size="11">货物到了吗？</text>
  <rect x="28" y="212" width="236" height="64" rx="10" fill="#202c33"/>
  <circle cx="56" cy="244" r="16" fill="#3b4a54"/>
  <text x="84" y="240" fill="#e9edef" font-family="Segoe UI, system-ui, sans-serif" font-size="13">support_sample</text>
  <text x="84" y="260" fill="#8696a0" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Thanks — demo only</text>

  <!-- main chat -->
  <rect x="276" y="64" width="668" height="56" fill="url(#header)"/>
  <circle cx="308" cy="92" r="16" fill="#00a884"/>
  <text x="336" y="88" fill="#e9edef" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600">logistics_demo</text>
  <text x="336" y="106" fill="#8696a0" font-family="Segoe UI, system-ui, sans-serif" font-size="11">demo chat · not a real customer</text>

  <!-- messages -->
  <rect x="300" y="140" width="280" height="54" rx="10" fill="#202c33"/>
  <text x="316" y="162" fill="#e9edef" font-family="Segoe UI, system-ui, sans-serif" font-size="13">你好，请问我的货物到了吗？</text>
  <text x="316" y="182" fill="#8696a0" font-family="Segoe UI, system-ui, sans-serif" font-size="11">10:02</text>

  <rect x="560" y="210" width="300" height="54" rx="10" fill="#005c4b"/>
  <text x="576" y="232" fill="#e9edef" font-family="Segoe UI, system-ui, sans-serif" font-size="13">您好，我这边马上帮您查询。</text>
  <text x="576" y="252" fill="#a3d4c6" font-family="Segoe UI, system-ui, sans-serif" font-size="11">10:03 ✓✓</text>

  <rect x="300" y="280" width="300" height="54" rx="10" fill="#202c33"/>
  <text x="316" y="302" fill="#e9edef" font-family="Segoe UI, system-ui, sans-serif" font-size="13">大概什么时候能送到？</text>
  <text x="316" y="322" fill="#8696a0" font-family="Segoe UI, system-ui, sans-serif" font-size="11">10:04</text>

  <!-- explain panel -->
  <g filter="url(#soft)">
    <rect x="620" y="130" width="300" height="210" rx="14" fill="#1e1033" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="640" y="158" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">AI 解释面板</text>
  <text x="640" y="186" fill="#e9d5ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">话术建议</text>
  <text x="640" y="208" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="13">货物正在派送中，预计今日</text>
  <text x="640" y="228" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="13">18:00 前送达，请保持电话畅通。</text>
  <text x="640" y="258" fill="#e9d5ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">解释</text>
  <text x="640" y="280" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="12">确认收到询问，给出时效与下一步。</text>
  <text x="640" y="310" fill="#e9d5ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">原文翻译</text>
  <text x="640" y="330" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Your shipment is out for delivery…</text>

  <!-- composer bar -->
  <rect x="276" y="448" width="668" height="56" fill="#202c33"/>
  <rect x="296" y="460" width="470" height="32" rx="16" fill="#2a3942"/>
  <text x="316" y="481" fill="#8696a0" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Type a message</text>

  <!-- AI pill button -->
  <g filter="url(#soft)">
    <rect x="780" y="458" width="86" height="36" rx="18" fill="url(#ai)"/>
  </g>
  <text x="800" y="481" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="16">✦</text>
  <text x="818" y="481" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">AI</text>

  <!-- callouts -->
  <path d="M823 448 L823 400 L700 360" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="640" y="336" width="0" height="0"/>
  <rect x="688" y="348" width="120" height="28" rx="8" fill="#3b0764"/>
  <text x="748" y="367" text-anchor="middle" fill="#f5d0fe" font-family="Segoe UI, system-ui, sans-serif" font-size="11">空输入 = 回复</text>
  <text x="748" y="395" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="11">有草稿 = 润色 · 右键 = 设置</text>

  <text x="36" y="492" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Stylized mock · not WhatsApp branding assets · demo copy only</text>
</svg>
