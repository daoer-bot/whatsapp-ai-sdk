<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">Architecture</title>
  <desc id="desc">content.js in isolated world talks to inject.js in page world over postMessage RPC.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L9 5 L0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="880" height="300" rx="14" fill="#0b1220"/>

  <!-- left -->
  <rect x="36" y="36" width="320" height="228" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <circle cx="64" cy="68" r="6" fill="#3b82f6"/>
  <text x="80" y="74" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Isolated world</text>
  <text x="56" y="120" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">content.js</text>
  <text x="56" y="158" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="15">✦ UI / settings / panel</text>
  <text x="56" y="190" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="15">AI · mock · dify · openai</text>
  <text x="56" y="222" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="13">chrome.storage · fetch</text>

  <!-- right -->
  <rect x="524" y="36" width="320" height="228" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <circle cx="552" cy="68" r="6" fill="#14b8a6"/>
  <text x="568" y="74" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Page world</text>
  <text x="544" y="120" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">inject.js</text>
  <text x="544" y="158" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="15">window.WhatsappAI</text>
  <text x="544" y="190" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="15">chat · composer · send</text>
  <text x="544" y="222" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="13">WPP → React → DOM</text>

  <!-- bridge -->
  <line x1="368" y1="150" x2="512" y2="150" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="404" y="128" width="72" height="28" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="440" y="147" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="13">RPC</text>
</svg>
