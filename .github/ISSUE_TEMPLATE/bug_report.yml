name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        请不要提交 API key、cookie、手机号、聊天记录或其他个人数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小化复现步骤。
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器版本
      placeholder: Chrome 版本
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: 扩展版本
      placeholder: 例如 0.1.1
    validations:
      required: true
